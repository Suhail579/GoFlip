{% extends 'base.html' %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">

<style>


/* Hide GoFlip AI on OTP page */
.goflip-ai-button,
.goflip-ai-chat {
    display: none !important;
}




    .GoFlip-navbar {
        display: none !important;
    }

    .GoFlip-page {
        padding-top: 1px !important;
    }


body {
    margin: 0;
    padding: 0;
}
  * { box-sizing: border-box; }

  .auth-stage {
    min-height: 100vh;
    background: #CFDCBD;
    background-image: radial-gradient(rgba(29, 61, 45, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    background: #F0F3E8;
    border-radius: 20px;
    padding: 2.6rem 2.3rem 2.15rem;
    text-align: center;
    box-shadow:
      0 1px 2px rgba(29, 61, 45, 0.08),
      0 16px 32px rgba(29, 61, 45, 0.16),
      0 34px 60px rgba(29, 61, 45, 0.12);
  }

  .otp-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #1D3D2D;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.3rem;
  }

  .otp-icon svg {
    width: 24px;
    height: 24px;
  }

  .auth-card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.65rem;
    color: #1D3D2D;
    margin: 0 0 0.5rem;
  }

  .auth-card .sub {
    font-size: 0.9rem;
    color: #6B7568;
    line-height: 1.5;
    margin: 0 0 1.8rem;
  }

  .error-banner {
    background: #FBE8E4;
    color: #B3402B;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.65rem 0.9rem;
    border-radius: 9px;
    margin: 0 0 1.4rem;
    text-align: left;
  }

  .otp-input {
    width: 100%;
    padding: 0.9rem 0.5rem;
    border: 1.5px solid #DAE3CE;
    border-radius: 12px;
    background: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 600;
    color: #1D3D2D;
    text-align: center;
    letter-spacing: 0.9rem;
    text-indent: 0.9rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .otp-input::placeholder {
    letter-spacing: normal;
    text-indent: 0;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: #A6AA9C;
  }

  .otp-input:focus {
    outline: none;
    border-color: #1D3D2D;
    box-shadow: 0 0 0 4px rgba(29, 61, 45, 0.1);
  }

  .submit-btn {
    width: 100%;
    padding: 0.85rem;
    margin-top: 1.5rem;
    background: #1D3D2D;
    color: #F0F3E8;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(29, 61, 45, 0.25);
    transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
  }

  .submit-btn:hover {
    background: #274F3B;
    box-shadow: 0 14px 28px rgba(29, 61, 45, 0.3);
    transform: translateY(-1px);
  }

  .submit-btn:active { transform: translateY(0); }

  .resend-line {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: #6B7568;
  }

  .resend-line button {
    background: none;
    border: none;
    padding: 0;
    color: #1D3D2D;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    border-bottom: 2px solid #1D3D2D;
  }

  .resend-line button:hover { opacity: 0.7; }

  /* ---------- Mobile ---------- */
  @media (max-width: 480px) {
    .auth-stage { padding: 1.5rem 1rem; }
    .auth-card {
      padding: 2.1rem 1.5rem 1.75rem;
      border-radius: 16px;
      box-shadow:
        0 1px 2px rgba(29, 61, 45, 0.08),
        0 10px 22px rgba(29, 61, 45, 0.1);
    }
    .auth-card h2 { font-size: 1.4rem; }
    .otp-input { font-size: 1.25rem; letter-spacing: 0.65rem; }
  }
</style>

<div class="auth-stage">
  <div class="auth-card">
    <div class="otp-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F0F3E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h2>Enter OTP</h2>
    <p class="sub">We sent a 6-digit code to your email or phone. Enter it below to continue.</p>

    {% if error %}
      <div class="error-banner">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <input
          type="text"
          class="otp-input"
          name="otp"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="one-time-code"
          required
      >

      <button type="submit" class="submit-btn">Verify OTP</button>
    </form>

    <p class="resend-line">
      Didn't get a code? <button type="button">Resend</button>
    </p>
  </div>
</div>
<!-- =========================================================
     GoFlip FOOTER
========================================================= -->

<style>

/* =========================================================
   GoFlip MAIN FOOTER
========================================================= */

.site-footer {
    width: 100%;
    background: #1D3D2D;
    color: #F0F3E8;
    font-family: 'Inter', sans-serif;
}


/* =========================
   FOOTER CONTENT
========================= */

.footer-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 50px 30px;

    display: grid;

    grid-template-columns:
        1.5fr
        1fr
        1fr
        1fr;

    gap: 45px;
}


/* =========================
   BRAND
========================= */

.footer-brand h2 {
    font-family: 'Fraunces', serif;

    font-size: 30px;

    margin: 0 0 12px;

    color: #F0F3E8;
}

.footer-brand p {
    max-width: 280px;

    color: #C9D5C2;

    font-size: 13px;

    line-height: 1.7;

    margin: 0;
}


/* =========================
   FOOTER HEADINGS
========================= */

.footer-links h3,
.footer-contact h3 {
    font-size: 14px;

    font-weight: 600;

    margin: 0 0 17px;

    color: #FFFFFF;
}


/* =========================
   LINKS
========================= */

.footer-links {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.footer-links a {
    color: #C9D5C2;

    font-size: 12px;

    text-decoration: none;

    transition: 0.2s ease;
}

.footer-links a:hover {
    color: #FFFFFF;

    transform: translateX(3px);
}


/* =========================
   CONTACT
========================= */

.footer-contact p {
    color: #C9D5C2;

    font-size: 12px;

    margin: 0 0 11px;
}


/* =========================
   FOOTER BOTTOM
========================= */

.footer-bottom {
    max-width: 1100px;

    margin: 0 auto;

    padding: 18px 30px;

    border-top:
        1px solid rgba(240, 243, 232, 0.15);

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.footer-bottom p {
    margin: 0;

    color: #AEBEAA;

    font-size: 11px;
}


/* =========================
   SOCIAL LINKS
========================= */

.social-links {
    display: flex;

    gap: 20px;
}

.social-links a {
    color: #C9D5C2;

    font-size: 11px;

    text-decoration: none;
}

.social-links a:hover {
    color: #FFFFFF;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .footer-content {
        grid-template-columns: 1fr 1fr;

        padding: 40px 22px;

        gap: 30px;
    }

    .footer-brand {
        grid-column: 1 / -1;
    }

    .footer-bottom {
        padding: 18px 22px;

        flex-direction: column;

        text-align: center;
    }
}


@media (max-width: 450px) {

    .footer-content {
        grid-template-columns: 1fr;

        gap: 28px;
    }

    .footer-brand {
        grid-column: auto;
    }

}

</style>


{% endblock %}
