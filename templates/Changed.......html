    {% extends 'base.html' %}

    {% block content %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>
        .GoFlip-navbar{
            display: none !important;
            }
        .GoFlip-page {
            padding-top: 26px !important;
}

        .forgot-page {
            min-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            font-family: 'Inter', sans-serif;
        }

        .forgot-box {
            width: 100%;
            max-width: 450px;
            background: #F0F3E8;
            border-radius: 28px;
            padding: 42px 38px;
            box-shadow: 0 15px 40px rgba(29, 61, 45, 0.12);
            text-align: center;
        }

        .forgot-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #1D3D2D;
            color: #F0F3E8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .forgot-box h1 {
            font-family: 'Fraunces', serif;
            color: #1D3D2D;
            font-size: 32px;
            margin: 0 0 10px;
        }

        .forgot-box p {
            color: #647065;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .email-label {
            display: block;
            text-align: left;
            color: #1D3D2D;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .email-input {
            width: 100%;
            height: 52px;
            border: 1px solid #d3dacb;
            border-radius: 14px;
            padding: 0 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .email-input:focus {
            border-color: #1D3D2D;
            box-shadow: 0 0 0 3px rgba(29, 61, 45, 0.08);
        }

        .reset-btn {
            width: 100%;
            height: 52px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            background: #1D3D2D;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #294d3b;
        }

        .back-login {
            display: inline-block;
            margin-top: 22px;
            color: #1D3D2D;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .forgot-page {
                padding: 20px 15px;
            }

            .forgot-box {
                padding: 35px 24px;
                border-radius: 24px;
            }

            .forgot-box h1 {
                font-size: 28px;
            }

        }

    </style>

    <div class="forgot-page">
    <div class="forgot-box">

        <div class="forgot-icon">
            <i class="bi bi-lock"></i>
        </div>

        <h1>Forgot Password?</h1>

        <p>
            Don't worry. Enter your email address and we'll send you
            a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            <label class="email-label" for="id_email">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                class="email-input"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <button type="submit" class="reset-btn">
                Send Reset Link
            </button>

        </form>

        <a href="{% url 'Login' %}" class="back-login">
            <i class="bi bi-arrow-left"></i>
            Back to Login
        </a>

    </div>

    </div>
    {% endblock %}
