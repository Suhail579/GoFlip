{% load static %}

<style>

    /* ================================
       CATEGORY GRID
    ================================= */

    .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
        gap: 27px;
    }


    /* ================================
       EACH CATEGORY CARD
    ================================= */

    .category-card {
        background-color: #FFFFFF;
        border-radius: 18px;
        padding: 20px 10px;
        text-align: center;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow:
            0 2px 6px rgba(29, 61, 45, 0.05),
            0 8px 18px rgba(29, 61, 45, 0.07);
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.18s ease;
    }

    .category-card:hover {
        transform: translateY(-4px);
        background-color: #FFFFFF;
        box-shadow:
            0 4px 12px rgba(29, 61, 45, 0.08),
            0 14px 28px rgba(29, 61, 45, 0.12);
    }

    .category-card:hover .category-icon {
        background-color: #D8B36A;
        transform: scale(1.05);
    }

    .category-card:hover .category-icon svg {
        stroke: #1D3D2D;
    }

    /* ================================
       ICON CIRCLE
    ================================= */

    .category-icon {
        width: 54px;
        height: 52px;
        margin-bottom: 10px;
        border-radius: 50%;
        background-color: #E9EFDD;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.18s ease, transform 0.18s ease;
    }

    .category-icon svg {
        width: 24px;
        height: 24px;
        transition: stroke 0.18s ease;
    }

    .category-icon img {
        width: 26px;
        height: 26px;
        object-fit: contain;
    }

    /* ================================
       CATEGORY NAME
    ================================= */

    .category-name {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #1D3D2D;
        line-height: 1.2;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {
        .category-grid {
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }

        .category-card {
            padding: 14px 6px;
            border-radius: 14px;
        }

        .category-card:hover {
            transform: translateY(-2px);
        }

        .category-icon {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
        }

        .category-icon svg,
        .category-icon img {
            width: 20px;
            height: 20px;
        }

        .category-name {
            font-size: 11.5px;
        }
    }

</style>
