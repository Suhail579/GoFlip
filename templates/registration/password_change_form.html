{% extends 'base.html' %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   HIDE NAVBAR
========================= */

.GoFlip-navbar {
    display: none !important;
}

.GoFlip-page {
    padding-top: 26px !important;
}


/* =========================
   PAGE
========================= */

.password-change-page {
    min-height: calc(100vh - 100px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    font-family: 'Inter', sans-serif;
}


/* =========================
   BOX
========================= */

.password-change-box {
    width: 100%;
    max-width: 450px;

    background: #F0F3E8;

    border-radius: 28px;

    padding: 42px 38px;

    box-shadow:
        0 15px 40px rgba(29, 61, 45, 0.12);
}


/* =========================
   ICON
========================= */

.password-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #1D3D2D;

    color: #F0F3E8;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
}


/* =========================
   TITLE
========================= */

.password-change-box h1 {
    font-family: 'Fraunces', serif;

    color: #1D3D2D;

    font-size: 32px;

    text-align: center;

    margin: 0 0 8px;
}


/* =========================
   DESCRIPTION
========================= */

.password-description {
    color: #647065;

    font-size: 14px;

    line-height: 1.6;

    text-align: center;

    margin-bottom: 28px;
}


/* =========================
   FORM
========================= */

.password-form p {
    margin: 0 0 18px;
}


/* =========================
   LABEL
========================= */

.password-form label {
    display: block;

    margin-bottom: 7px;

    color: #1D3D2D;

    font-size: 13px;

    font-weight: 600;
}


/* =========================
   INPUT
========================= */

.password-form input {
    width: 100%;

    height: 50px;

    padding: 0 14px;

    border: 1px solid #D5DCCF;

    border-radius: 12px;

    background: white;

    color: #1D3D2D;

    font-family: 'Inter', sans-serif;

    font-size: 14px;

    outline: none;

    box-sizing: border-box;

    transition: 0.2s ease;
}

.password-form input:focus {
    border-color: #1D3D2D;

    box-shadow:
        0 0 0 3px rgba(29, 61, 45, 0.08);
}


/* =========================
   HELP TEXT
========================= */

.password-form ul {
    margin: 8px 0 0;

    padding-left: 18px;

    color: #7D8979;

    font-size: 11px;

    line-height: 1.6;
}


/* =========================
   ERRORS
========================= */

.password-form .errorlist {
    margin: 6px 0 0;

    padding: 0;

    list-style: none;

    color: #b14d4d;

    font-size: 12px;
}


/* =========================
   BUTTON
========================= */

.change-password-btn {
    width: 100%;

    height: 52px;

    margin-top: 8px;

    border: none;

    border-radius: 14px;

    background: #1D3D2D;

    color: white;

    font-family: 'Inter', sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

.change-password-btn:hover {
    background: #294d3b;
}


/* =========================
   BACK LINK
========================= */

.back-link {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #1D3D2D;

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;
}

.back-link:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .password-change-page {
        padding: 20px 15px;
    }

    .password-change-box {
        padding: 35px 24px;

        border-radius: 24px;
    }

    .password-change-box h1 {
        font-size: 28px;
    }

}

</style>


<div class="password-change-page">

    <div class="password-change-box">

        <!-- ICON -->

        <div class="password-icon">
            <i class="bi bi-shield-lock"></i>
        </div>


        <!-- TITLE -->

        <h1>
            Change Password
        </h1>


        <!-- DESCRIPTION -->

        <p class="password-description">
            Enter your current password and choose a new password
            for your account.
        </p>


        <!-- FORM -->

        <form method="post" class="password-form">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="change-password-btn"
            >
                <i class="bi bi-check2"></i>
                Change Password
            </button>

        </form>


        <!-- BACK -->

        <a
            href="{% url 'Profile' %}"
            class="back-link"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Profile
        </a>

    </div>

</div>

{% endblock %}

</title>
</head>
<body>

</body>
</html>
