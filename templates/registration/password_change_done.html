{% extends 'base.html' %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   HIDE NAVBAR
========================= */

.GoFlip-navbar {
    display: none !important;
}

.GoFlip-page {
    padding-top: 26px !important;
}


/* =========================
   PAGE
========================= */

.password-done-page {
    min-height: calc(100vh - 100px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    font-family: 'Inter', sans-serif;
}


/* =========================
   BOX
========================= */

.password-done-box {
    width: 100%;
    max-width: 450px;

    background: #F0F3E8;

    border-radius: 28px;

    padding: 42px 38px;

    box-shadow:
        0 15px 40px rgba(29, 61, 45, 0.12);

    text-align: center;
}


/* =========================
   ICON
========================= */

.password-done-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #1D3D2D;

    color: #F0F3E8;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
}


/* =========================
   TITLE
========================= */

.password-done-box h1 {
    font-family: 'Fraunces', serif;

    color: #1D3D2D;

    font-size: 32px;

    margin: 0 0 12px;
}


/* =========================
   TEXT
========================= */

.password-done-box p {
    color: #647065;

    font-size: 14px;

    line-height: 1.7;

    margin: 0;
}


/* =========================
   BUTTON
========================= */

.profile-btn {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    width: 100%;
    height: 52px;

    margin-top: 25px;

    border-radius: 14px;

    background: #1D3D2D;

    color: white;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: 0.2s ease;
}

.profile-btn:hover {
    background: #294d3b;

    color: white;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .password-done-page {
        padding: 20px 15px;
    }

    .password-done-box {
        padding: 35px 24px;

        border-radius: 24px;
    }

    .password-done-box h1 {
        font-size: 28px;
    }

}

</style>


<div class="password-done-page">

    <div class="password-done-box">

        <!-- SUCCESS ICON -->

        <div class="password-done-icon">
            <i class="bi bi-check-lg"></i>
        </div>


        <!-- TITLE -->

        <h1>
            Password Changed
        </h1>


        <!-- MESSAGE -->

        <p>
            Your password has been changed successfully.
        </p>


        <!-- PROFILE BUTTON -->

        <a
            href="{% url 'Profile' %}"
            class="profile-btn"
        >
            <i class="bi bi-person"></i>
            Back to Profile
        </a>

    </div>

</div>

{% endblock %}
