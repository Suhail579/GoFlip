{% extends 'base.html' %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   HIDE NAVBAR
========================= */

.GoFlip-navbar {
    display: none !important;
}

.GoFlip-page {
    padding-top: 26px !important;
}


/* =========================
   PAGE
========================= */

.email-sent-page {
    min-height: calc(100vh - 100px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    font-family: 'Inter', sans-serif;
}


/* =========================
   BOX
========================= */

.email-sent-box {
    width: 100%;
    max-width: 450px;

    background: #F0F3E8;

    border-radius: 28px;

    padding: 42px 38px;

    box-shadow:
        0 15px 40px rgba(29, 61, 45, 0.12);

    text-align: center;
}


/* =========================
   ICON
========================= */

.email-sent-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #1D3D2D;

    color: #F0F3E8;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
}


/* =========================
   TITLE
========================= */

.email-sent-box h1 {
    font-family: 'Fraunces', serif;

    color: #1D3D2D;

    font-size: 32px;

    margin: 0 0 12px;
}


/* =========================
   TEXT
========================= */

.email-sent-box p {
    color: #647065;

    font-size: 14px;

    line-height: 1.7;

    margin: 0 0 10px;
}


/* =========================
   OPEN GMAIL BUTTON
========================= */

.login-btn {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    width: 100%;
    height: 52px;

    margin-top: 25px;

    border-radius: 14px;

    background: #1D3D2D;

    color: white;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: 0.2s ease;
}

.login-btn:hover {
    background: #294d3b;

    color: white;
}


/* =========================
   LINKS
========================= */

.page-link {
    display: block;

    margin-top: 18px;

    color: #1D3D2D;

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;
}

.page-link:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .email-sent-page {
        padding: 20px 15px;
    }

    .email-sent-box {
        padding: 35px 24px;

        border-radius: 24px;
    }

    .email-sent-box h1 {
        font-size: 28px;
    }

}

</style>


<div class="email-sent-page">

    <div class="email-sent-box">

        <!-- MAIL ICON -->

        <div class="email-sent-icon">
            <i class="bi bi-envelope-check"></i>
        </div>


        <!-- TITLE -->

        <h1>
            Check Your Email
        </h1>


        <!-- MESSAGE -->

        <p>
            We have sent a password reset link to your email address.
        </p>


        <!-- OPEN GMAIL -->

        <a
            href="https://mail.google.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="login-btn"
        >
            <i class="bi bi-envelope-open"></i>
            Open Gmail
        </a>


        <!-- BACK TO LOGIN -->

        <a
            href="{% url 'Login' %}"
            class="page-link"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Login
        </a>


        <!-- TRY AGAIN -->

        <a
            href="{% url 'password_reset' %}"
            class="page-link"
        >
            Didn't receive the email? Try again
        </a>

    </div>

</div>

{% endblock %}
