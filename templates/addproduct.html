{% extends 'base.html' %}
{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
    }

    .add-page {
        background-color: #CFDCBD;
        background-image: radial-gradient(rgba(29, 61, 45, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        min-height: 100vh;
        padding: 30px 20px 60px;
        font-family: 'Inter', sans-serif;
    }

    .add-wrap {
        max-width: 900px;
        margin: 0 auto;
    }


    /* ================================
       PAGE HEADING
    ================================= */

    .add-heading h1 {
        font-family: 'Fraunces', serif;
        color: #1D3D2D;
        font-size: 24px;
        margin: 0 0 6px;
    }

    .add-heading p {
        color: #5C6B57;
        font-size: 14px;
        margin: 0 0 24px;
    }


    /* ================================
       CATEGORY GRID
    ================================= */

    .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 16px;
    }


    /* ================================
       EACH CATEGORY CARD
       Whole card is clickable
    ================================= */

    .category-card {
        background-color: #F0F3E8;
        border-radius: 16px;
        padding: 24px 12px;
        text-align: center;
        text-decoration: none;
        display: block;
        box-shadow:
            0 2px 6px rgba(29, 61, 45, 0.06),
            0 8px 18px rgba(29, 61, 45, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .category-card:hover {
        background-color: #1D3D2D;
        transform: translateY(-3px);
        box-shadow:
            0 4px 10px rgba(29, 61, 45, 0.12),
            0 14px 26px rgba(29, 61, 45, 0.16);
    }

    /* When card is hovered, invert the icon + text colors */
    .category-card:hover .category-icon {
        background-color: rgba(240, 243, 232, 0.15);
    }

    .category-card:hover .category-icon svg {
        stroke: #F0F3E8;
    }

    .category-card:hover .category-name {
        color: #F0F3E8;
    }


    /* ================================
       ICON CIRCLE
    ================================= */

    .category-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background-color: #DAE3CE;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;
    }

    .category-icon svg {
        width: 26px;
        height: 26px;
        stroke: #1D3D2D;
        transition: stroke 0.15s ease;
    }


    /* ================================
       CATEGORY NAME
    ================================= */

    .category-name {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #1D3D2D;
        transition: color 0.15s ease;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

        .add-page {
            padding: 20px 12px 40px;
        }

        .add-heading h1 {
            font-size: 20px;
        }

        .category-grid {
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .category-card {
            padding: 18px 8px;
            border-radius: 14px;
        }

        .category-icon {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
        }

        .category-icon svg {
            width: 22px;
            height: 22px;
        }

        .category-name {
            font-size: 12.5px;
        }

    }

</style>


<div class="add-page">
    <div class="add-wrap">

        <div class="add-heading">
            <h1>Add Product</h1>
            <p>Choose the category that best fits what you're selling.</p>
        </div>

        <div class="category-grid">

            <!-- CAR -->
            <a href="{% url 'Car' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17h14M5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM3 17V9l2-5h14l2 5v8"/>
                    </svg>
                </div>
                <div class="category-name">Car</div>
            </a>

            <!-- BIKE -->
            <a href="{% url 'Bike' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5.5" cy="17.5" r="3.5"/>
                        <circle cx="18.5" cy="17.5" r="3.5"/>
                        <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM5.5 17.5L11 8h4l3.5 9.5M11 8l-3 5h6"/>
                    </svg>
                </div>
                <div class="category-name">Bike</div>
            </a>

            <!-- MOBILES -->
            <a href="{% url 'Mobiles' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="7" y="2" width="10" height="20" rx="2"/>
                        <line x1="11" y1="18" x2="13" y2="18"/>
                    </svg>
                </div>
                <div class="category-name">Mobiles</div>
            </a>

            <!-- ELECTRONICS -->
            <a href="{% url 'Electronics' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <div class="category-name">Electronics</div>
            </a>

            <!-- FURNITURE -->
            <a href="{% url 'Furnitures' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3H3V9z"/>
                        <path d="M3 12v7M21 12v7M3 16h18"/>
                    </svg>
                </div>
                <div class="category-name">Furniture</div>
            </a>

            <!-- BOOKS -->
            <a href="{% url 'Books' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                <div class="category-name">Books</div>
            </a>

            <!-- GADGETS -->
            <a href="{% url 'Gadgetss' %}" class="category-card">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </div>
                <div class="category-name">Gadgets</div>
            </a>

            <!-- OTHER (no URL yet) -->
            <div class="category-card" style="cursor: pointer;">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </svg>
                </div>
                <div class="category-name">Other</div>
            </div>

        </div>

    </div>
</div>

{% endblock %}
